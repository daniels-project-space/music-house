name: Publish Music House MiniMax Music3 worker

on:
  push:
    branches: [main]
    paths:
      - "workers/minimax-music3/**"
      - ".github/workflows/publish-minimax-music3-worker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: workers/minimax-music3
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/music-house-minimax-music3:${{ github.sha }}
          provenance: false
